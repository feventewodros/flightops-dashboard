spring:
  application:
    name: flightops-dashboard
  thymeleaf:
    cache: false

server:
  # Binds to the platform-provided port when deployed (Render sets $PORT), else 8090 locally.
  port: ${PORT:8090}

# Base URL of the FlightOps REST API this dashboard talks to.
# Override with API_BASE_URL in Docker / production.
flightops:
  api:
    base-url: ${API_BASE_URL:http://localhost:8080}
