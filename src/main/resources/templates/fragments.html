<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">FlightOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f5f7fa; }
        .navbar-brand { font-weight:700; letter-spacing:.5px; }
        .status-SCHEDULED { color:#0d6efd; }
        .status-DELAYED   { color:#fd7e14; font-weight:600; }
        .status-CANCELLED { color:#dc3545; font-weight:600; }
        .status-BOARDING, .status-DEPARTED, .status-IN_AIR { color:#20c997; }
        .status-ARRIVED   { color:#6c757d; }
    </style>
</head>
<body>

<nav th:fragment="nav(username)" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">✈️ FlightOps</a>
        <div class="ms-auto">
            <span th:if="${username}" class="text-white me-3">
                Signed in as <strong th:text="${username}">user</strong>
            </span>
            <a th:if="${username}" href="/logout" class="btn btn-outline-light btn-sm">Sign out</a>
            <a th:unless="${username}" href="/login" class="btn btn-outline-light btn-sm">Sign in</a>
        </div>
    </div>
</nav>

<div th:fragment="flash">
    <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
</div>

</body>
</html>
